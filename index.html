<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UPI App Launcher</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#0f1117;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:420px;
        background:#1a1d26;
        border:1px solid #2b3040;
        border-radius:20px;
        padding:20px;
    }

    h2{
        margin-bottom:20px;
        text-align:center;
    }

    .card{
        background:#222635;
        border-radius:15px;
        padding:15px;
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:10px;
        font-size:14px;
        color:#aaa;
    }

    select,input{
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        outline:none;
        background:#11141c;
        color:white;
        margin-bottom:12px;
    }

    button{
        width:100%;
        padding:13px;
        border:none;
        border-radius:12px;
        background:#f5a623;
        color:black;
        font-weight:bold;
        cursor:pointer;
        transition:0.2s;
    }

    button:hover{
        transform:scale(0.98);
    }

    .qr-btn{
        margin-top:20px;
        background:#00c853;
        color:white;
        font-size:16px;
    }

    .saved{
        margin-top:10px;
        color:#00e676;
        font-size:13px;
        text-align:center;
    }
</style>
</head>
<body>

<div class="container">

    <h2>UPI App Settings</h2>

    <div class="card">

        <label>Select UPI App</label>

        <select id="upiSelect">
            <option value="tez://upi/pay">Google Pay</option>
            <option value="phonepe://pay">PhonePe</option>
            <option value="paytmmp://pay">Paytm</option>
            <option value="bhim://upi/pay">BHIM</option>
        </select>

        <button onclick="saveUPI()">
            Save Selected App
        </button>

        <div class="saved" id="savedText"></div>

    </div>

    <div class="card">

        <label>Custom UPI App Name</label>
        <input type="text" id="customName" placeholder="Example: Super Pay">

        <label>Custom UPI URL</label>
        <input type="text" id="customURL" placeholder="Example: superpay://upi/pay">

        <button onclick="addCustomUPI()">
            Add Custom UPI App
        </button>

    </div>

    <button class="qr-btn" onclick="openUPIApp()">
        Open QR / UPI App
    </button>

</div>

<script>

function saveUPI() {

    const selected = document.getElementById("upiSelect").value;

    localStorage.setItem("preferred_upi", selected);

    document.getElementById("savedText").innerText =
        "UPI App Saved Successfully ✅";
}

function addCustomUPI() {

    const name = document.getElementById("customName").value;
    const url = document.getElementById("customURL").value;

    if(name === "" || url === "") {
        alert("Enter app name and URL");
        return;
    }

    const select = document.getElementById("upiSelect");

    const option = document.createElement("option");

    option.text = name;
    option.value = url;

    select.add(option);

    document.getElementById("customName").value = "";
    document.getElementById("customURL").value = "";

    alert("Custom UPI App Added ✅");
}

function openUPIApp() {

    const appURL = localStorage.getItem("preferred_upi");

    if(!appURL){
        alert("Please select a UPI app first");
        return;
    }

    window.location.href = appURL;

    setTimeout(() => {
        alert("If app is not installed, nothing may happen.");
    }, 1500);
}

</script>

</body>
</html>
